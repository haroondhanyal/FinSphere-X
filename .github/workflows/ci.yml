name: FinSphere X CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e 'apps/api[dev]'
      - run: ruff check apps/api/app apps/api/migrations apps/api/tests
      - run: pytest -q
        working-directory: apps/api
      - run: DATABASE_URL=sqlite:////tmp/finspherex-ci.db python -m alembic upgrade head
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm typecheck:web
      - run: pnpm lint:web
      - run: pnpm build:web
      - run: pnpm --filter @finsphere/web exec playwright install --with-deps chromium
      - run: pnpm --filter @finsphere/web test:e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e 'apps/api[dev]' pip-audit
      - run: pip-audit --local --skip-editable
      - run: bash scripts/security-check.sh

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t finspherex-api:ci ./apps/api
      - run: docker build -t finspherex-web:ci -f apps/web/Dockerfile .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform init -backend=false
      - run: terraform -chdir=infrastructure/terraform validate
