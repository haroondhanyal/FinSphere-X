services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finsphere
      POSTGRES_USER: finsphere
      POSTGRES_PASSWORD: finsphere-local-only
    ports: ["5432:5432"]
    volumes: ["finsphere-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsphere -d finsphere"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://finsphere:finsphere-local-only@postgres:5432/finsphere
      JWT_SECRET: local-compose-only-secret-change-for-real-deployment
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  finsphere-postgres:
