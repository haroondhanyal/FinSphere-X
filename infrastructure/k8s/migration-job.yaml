apiVersion: batch/v1
kind: Job
metadata:
  name: finspherex-migrations
  namespace: finspherex
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrations
          image: ghcr.io/replace-me/finspherex-api:stable
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: finspherex-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: finspherex-secrets
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
