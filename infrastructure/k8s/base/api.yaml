apiVersion: apps/v1
kind: Deployment
metadata:
  name: finspherex-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finspherex-api
  template:
    metadata:
      labels:
        app: finspherex-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/replace-me/finspherex-api:stable
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: kyc-upload-tmp
              mountPath: /app/uploads
          envFrom:
            - configMapRef:
                name: finspherex-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: finspherex-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finspherex-secrets
                  key: jwt-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finspherex-secrets
                  key: openai-api-key
                  optional: true
            - name: OPENAI_MODEL
              value: gpt-6-astra
            - name: MFA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: finspherex-secrets
                  key: mfa-encryption-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: kyc-upload-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: finspherex-api
spec:
  selector:
    app: finspherex-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finspherex-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finspherex-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
